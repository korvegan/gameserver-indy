framework:
  secret: '%env(indy_secret:resolve:SLICE_STATE_DIR)%'
  http_method_override: false
  handle_all_throwables: true
  http_client: ~
  trusted_hosts: ['^127\.0\.0\.1$', '^localhost$', '^(?:[a-z0-9-]+\.){2,}ts\.net$']
  messenger:
    transports:
      async:
        dsn: 'doctrine://default'
        options: {auto_setup: false}
        retry_strategy: {max_retries: 0}
      metadata:
        dsn: 'doctrine://default'
        options: {auto_setup: false, queue_name: metadata}
        retry_strategy: {max_retries: 0}
    routing:
      App\Job\ExecuteServerJob: async

when@test:
  framework:
    test: true
