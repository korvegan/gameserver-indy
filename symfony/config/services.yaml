parameters:
  env(SLICE_STATE_DIR): '%kernel.project_dir%/var/slice'
  env(SLICE_DRIVER): simulated
  env(SLICE_ROLE): owner
  env(SLICE_PORT): '18865'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $stateDirectory: '%env(resolve:SLICE_STATE_DIR)%'
      $driver: '%env(SLICE_DRIVER)%'
      $role: '%env(SLICE_ROLE)%'
      $projectDirectory: '%kernel.project_dir%'
      $localPort: '%env(int:SLICE_PORT)%'
  App\:
    resource: '../src/'
    exclude: ['../src/Kernel.php', '../src/Job/ExecuteServerJob.php', '../src/Access/Principal.php', '../src/Runtime/ServerStopped.php', '../src/Runtime/ServerActionCompleted.php', '../src/Runtime/RuntimeGuard.php']
  App\Runtime\ServerControl:
    alias: App\Runtime\SelectedServerControl
  App\Runtime\ProcessGateway:
    alias: App\Runtime\WindowsProcessGateway
  App\Integration\SteamProvider:
    alias: App\Integration\SteamCmd
  App\Integration\HostNetworkProvider:
    alias: App\Integration\WindowsNetwork
  App\Integration\DiscordTransport:
    alias: App\Integration\DiscordWebhook
  indy.discord_http:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
    autowire: false
    autoconfigure: false # Framework request logging/tracing would expose webhook tokens in URLs.
  App\Integration\DiscordWebhook:
    arguments:
      $client: '@indy.discord_http'
  App\WhatsApp\WhatsAppClient:
    alias: App\WhatsApp\LocalWhatsAppClient
  indy.whatsapp_http:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient','create']
    autowire: false
    autoconfigure: false
  App\WhatsApp\LocalWhatsAppClient:
    arguments:
      $client: '@indy.whatsapp_http'
