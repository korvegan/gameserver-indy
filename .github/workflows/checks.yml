name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  symfony:
    name: Symfony (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: symfony
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, dom, mbstring, xml, xmlwriter, ctype, tokenizer
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates
      - run: php vendor/bin/phpunit
      - name: Configuration parity with Python baseline
        run: python tools/compare_configurations.py
      - name: Native disposable Windows process
        if: runner.os == 'Windows'
        run: php vendor/bin/phpunit --filter NativeWindowsFlowTest
        env:
          SLICE_WINDOWS_TEST: '1'
  symfony-browser:
    name: Symfony browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --working-dir=symfony
      - name: Verified FrankenPHP binary
        run: |
          curl -fL --retry 2 -o /tmp/indy-frankenphp https://github.com/php/frankenphp/releases/download/v1.13.0/frankenphp-linux-x86_64
          echo '486673e20c014bfc4c9d27d5d3e78929f811c2834534f8117a56ab14de09e656  /tmp/indy-frankenphp' | sha256sum --check
          chmod 755 /tmp/indy-frankenphp
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: npm run test:symfony-browser
        env:
          SLICE_FRANKENPHP: /tmp/indy-frankenphp
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: symfony-browser-screenshots
          path: artifacts/symfony-*.png
          if-no-files-found: ignore
  test:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Windows process integration
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_windows*.py' -v
        env:
          GAMESERVER_WINDOWS_TEST: '1'
      - name: Windows launcher and shortcut installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test-desktop-launcher.ps1
      - name: Private family setup with isolated mocks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test-family-setup.ps1
  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
