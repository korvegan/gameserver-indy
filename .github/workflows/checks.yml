name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Check selection
    runs-on: ubuntu-latest
    outputs:
      symfony: ${{ steps.select.outputs.symfony }}
      symfony_os: ${{ steps.select.outputs.symfony_os }}
      dashboard_only: ${{ steps.select.outputs.dashboard_only }}
      native: ${{ steps.select.outputs.native }}
      ui: ${{ steps.select.outputs.ui }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - run: node --test tests/ci-plan.test.cjs
      - id: select
        run: node .github/ci-plan.cjs
  symfony:
    needs: plan
    if: needs.plan.outputs.symfony == 'true'
    name: Symfony (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.symfony_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # Native NTFS backup/restore fixtures already take about nine minutes.
    defaults:
      run:
        working-directory: symfony
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, zip, ${{ runner.os == 'Linux' && 'intl-77.1' || 'intl' }}, dom, mbstring, xml, xmlwriter, ctype, tokenizer
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates
      - name: Regular family workflows
        if: needs.plan.outputs.full != 'true' && runner.os != 'Windows'
        run: node ../scripts/phpunit.cjs ${{ needs.plan.outputs.dashboard_only == 'true' && '--filter DashboardTest' || '' }}
      - name: Extended tests (manual only)
        if: needs.plan.outputs.full == 'true'
        run: node ../scripts/phpunit.cjs --extended
      - name: Native disposable Windows process
        if: runner.os == 'Windows'
        run: node ../scripts/phpunit.cjs --filter Native
        env:
          SLICE_WINDOWS_TEST: '1'
      - name: Extended native tests (manual only)
        if: runner.os == 'Windows' && needs.plan.outputs.full == 'true'
        run: node ../scripts/phpunit.cjs --extended --filter Native
        env:
          SLICE_WINDOWS_TEST: '1'
      - name: Windows launcher and shortcut installer
        if: runner.os == 'Windows' && needs.plan.outputs.full == 'true'
        working-directory: .
        shell: powershell
        run: ./tests/test-desktop-launcher.ps1
      - name: Private family setup with isolated mocks
        if: runner.os == 'Windows' && needs.plan.outputs.full == 'true'
        working-directory: .
        shell: powershell
        run: ./tests/test-family-setup.ps1
  symfony-browser:
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    name: Symfony browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, zip, intl-77.1, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --working-dir=symfony
      - name: Linux supervisor process extensions
        run: |
          php -r 'exit(extension_loaded("pcntl") && extension_loaded("posix") ? 0 : 1);'
      - name: Verified FrankenPHP binary
        run: |
          curl -fL --retry 2 -o /tmp/indy-frankenphp https://github.com/php/frankenphp/releases/download/v1.13.0/frankenphp-linux-x86_64
          echo '486673e20c014bfc4c9d27d5d3e78929f811c2834534f8117a56ab14de09e656  /tmp/indy-frankenphp' | sha256sum --check
          chmod 755 /tmp/indy-frankenphp
      - run: npm ci --no-audit --no-fund
      - run: npm run check:js
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: npm run test:symfony-browser
        if: needs.plan.outputs.full == 'true'
        env:
          SLICE_FRANKENPHP: /tmp/indy-frankenphp
      - run: npm run test:symfony-dashboard
        if: needs.plan.outputs.full == 'true'
        env:
          SLICE_FRANKENPHP: /tmp/indy-frankenphp
      - run: npm run test:ui
        if: needs.plan.outputs.full != 'true'
        env:
          SLICE_FRANKENPHP: /tmp/indy-frankenphp
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: symfony-browser-screenshots
          path: artifacts/symfony-*.png
          if-no-files-found: ignore
  result:
    name: Relevant checks
    if: always()
    needs: [plan, symfony, symfony-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and all selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs=JSON.parse(process.env.RESULTS), p=jobs.plan.outputs;
          const selected={symfony:p.symfony==='true','symfony-browser':p.ui==='true'};
          if(jobs.plan.result!=='success' || Object.values(jobs).some(j=>!['success','skipped'].includes(j.result))
            || Object.entries(selected).some(([name,required])=>required && jobs[name].result!=='success')) process.exit(1);
          NODE
